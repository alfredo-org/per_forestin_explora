name: Build and publish Forestin
on:
  push:
    branches: [main]
    paths: ["src/**", "public/**", "index.html", "package.json", "package-lock.json", "tsconfig.json", "vite.config.ts", "game/**", "tools/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Export native adventure to Web
        run: python tools/export_web.py
      - name: Install browser QA
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Verify Godot boots in browser
        run: python tools/test_web.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-qa
          path: builds/web-qa
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publish expedition
        id: deployment
        uses: actions/deploy-pages@v4
